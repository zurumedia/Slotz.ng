<!doctype html>
<html><head><meta charset="utf-8"><title>Slotz</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
/* Short event links:  your-domain/mara-group  opens the Mara Group ticket page.
   Works on a custom domain (base "/") and on github.io (base "/Slotz.ng/"). */
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var base = '/';
  if (/\.github\.io$/i.test(location.hostname) && parts.length) { base = '/' + parts.shift() + '/'; }
  var name = (parts[0] || '').replace(/\.html?$/i, '');
  location.replace(base + (name ? '?event=' + encodeURIComponent(name) : ''));
})();
</script></head>
<body style="font-family:sans-serif;padding:24px">Opening Slotz…</body></html>
