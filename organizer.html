<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Slotz organizer dashboard</title>
<style>
:root{--bg:#F6F4FF;--card:#fff;--text:#14122B;--muted:#5d5a78;--brand:#6C3CF0;--cta:#C6F432;--ink:#14122B;--hot:#FF5C6C;--line:#dcd7f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14122B;--card:#1f1c3d;--text:#F6F4FF;--muted:#b4b0d6;--line:#352f66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:18px 18px 50px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.03em;color:var(--brand);margin:0 0 4px}.logo b{color:var(--hot)}
h2{margin:22px 0 8px;font-size:19px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button{font-family:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:14px;cursor:pointer;width:100%;margin-top:12px}
.go{background:var(--cta);color:var(--ink)}
.alt{background:none;color:var(--text);border:2px solid var(--text);font-size:15px;font-weight:700;padding:11px}
.msg{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.msg.bad{background:var(--hot);color:#14122B;border-color:var(--hot)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.k{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.k small{display:block;color:var(--muted);font-size:13px}.k b{display:block;font-size:22px;letter-spacing:-.01em;overflow-wrap:anywhere}
.k.pay{background:var(--cta);color:var(--ink);border-color:var(--cta)}.k.pay small{color:var(--ink);opacity:.75}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 14px}
.by{padding:10px 0;border-bottom:1px solid var(--line)}.by:last-child{border-bottom:0}
.by strong{display:block}.by span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.in{color:#1a8f4c;font-weight:700}
.muted{color:var(--muted);font-size:14px}
[hidden]{display:none!important}
</style>
<script src="config.js"></script>
</head>
<body>
<main>
<p class="logo">Slotz<b>.</b> organizer</p>
<div id="login">
  <label for="key">Dashboard key</label>
  <input id="key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="go" id="go">Open dashboard</button>
</div>
<div class="msg" id="msg" hidden></div>
<div id="dash" hidden>
  <h2 id="ttl" style="margin-top:14px"></h2>
  <p class="muted" id="upd" style="margin:0"></p>
  <div class="grid" id="kp"></div>
  <h2>Payout summary</h2>
  <div class="card" id="pay"></div>
  <p class="muted">Ticket sales are what buyers paid for tickets, before the Slotz service fee. Paid out is what Slotz has already sent you.</p>
  <h2>By ticket type</h2>
  <div class="card" id="ty"></div>
  <h2 id="bh">Buyers</h2>
  <input id="q" placeholder="Search name, phone or ticket number" aria-label="Search buyers">
  <div class="card" id="bl" style="margin-top:10px"></div>
  <button class="alt" id="csv">Download buyer list (CSV)</button>
  <button class="alt" id="ref">Refresh</button>
  <button class="alt" id="out">Sign out</button>
</div>
</main>
<script>
(function(){
var API=window.SLOTZ_API||"",ok=/^https:\/\/script\.google\.com\//.test(API),data=null,timer=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function n(v){return"\u20A6"+Number(v||0).toLocaleString("en-NG")}
function say(t,bad){var m=$("msg");m.className="msg"+(bad?" bad":"");m.textContent=t;m.hidden=!t}
try{$("key").value=sessionStorage.getItem("slotz-org")||""}catch(e){}
function kp(label,val,cls){return'<div class="k '+(cls||"")+'"><small>'+label+'</small><b>'+val+'</b></div>'}
function show(d){
  data=d;var s=d.summary;
  $("login").hidden=true;$("dash").hidden=false;say("");
  $("ttl").textContent=d.organizer+(d.scope==="ALL"?" · all events":" · "+d.scope);
  $("upd").textContent="Updated "+new Date().toLocaleTimeString("en-NG",{hour:"numeric",minute:"2-digit"});
  $("kp").innerHTML=kp("Tickets sold",s.tickets)+kp("People expected",s.people)+kp("Checked in",s.inside+" of "+s.people)+kp("Total collected",n(s.collected));
  $("pay").innerHTML=
    '<div class="row"><span>Ticket sales</span><strong>'+n(s.sales)+'</strong></div>'+
    '<div class="row"><span>Slotz service fees</span><strong>'+n(s.fees)+'</strong></div>'+
    '<div class="row"><span>Total paid by buyers</span><strong>'+n(s.collected)+'</strong></div>'+
    '<div class="row"><span>Paid out so far</span><strong>'+n(s.paidOut)+'</strong></div>'+
    '<div class="row"><span><b>Balance to be paid</b></span><strong>'+n(s.balance)+'</strong></div>';
  $("ty").innerHTML=d.byType.length?d.byType.map(function(t){return'<div class="by"><strong>'+esc(t.type)+(d.scope==="ALL"?" · "+esc(t.event):"")+'</strong><span>'+t.tickets+(t.tickets===1?" ticket":" tickets")+" · "+t.people+" people · "+n(t.sales)+'</span></div>'}).join(""):'<p class="muted">No tickets sold yet.</p>';
  $("bh").textContent="Buyers ("+d.total+")";
  list()
}
function list(){
  if(!data)return;
  var q=$("q").value.trim().toLowerCase();
  var a=data.buyers.filter(function(b){return!q||(b.name+" "+b.phone+" "+b.no+" "+b.email).toLowerCase().indexOf(q)>-1});
  $("bl").innerHTML=a.length?a.map(function(b){
    return'<div class="by"><strong>'+esc(b.name)+' <span>· '+esc(b.no)+'</span></strong><span>'+esc(b.type)+" · admits "+b.admits+" · "+n(b.paid)+(data.scope==="ALL"?" · "+esc(b.event):"")+'</span><br><span>'+esc(b.phone)+" · "+esc(b.email)+'</span><br><span>Bought '+esc(b.bought)+(b.used?' · <span class="in">Checked in '+esc(b.used)+'</span>':'')+'</span></div>'}).join(""):'<p class="muted" style="margin:10px 0">'+(data.buyers.length?"No match.":"No buyers yet.")+'</p>';
}
function load(){
  if(!ok){say("The dashboard could not connect. Try again later.",true);return}
  var k=$("key").value.trim();
  if(!k){say("Enter your dashboard key.",true);return}
  $("go").disabled=true;say("Loading…");
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"org",key:k})})
   .then(function(r){return r.json()}).then(function(d){
     $("go").disabled=false;
     if(d.result==="denied"){say("Wrong dashboard key. Check it and try again.",true);return}
     if(d.result==="org"){try{sessionStorage.setItem("slotz-org",k)}catch(e){}show(d);if(!timer)timer=setInterval(function(){if(!document.hidden&&data)quiet()},60000);return}
     say("Could not load the dashboard. Please try again.",true)
   }).catch(function(){$("go").disabled=false;say("Could not connect. Check your network and try again.",true)})
}
function quiet(){
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"org",key:$("key").value.trim()})})
   .then(function(r){return r.json()}).then(function(d){if(d.result==="org")show(d)}).catch(function(){})
}
function csv(){
  if(!data)return;
  function c(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'}
  var rows=[["Ticket no","Name","Phone","Email","Event","Ticket","Admits","Paid","Bought","Checked in"]].concat(data.buyers.map(function(b){return[b.no,b.name,b.phone,b.email,b.event,b.type,b.admits,b.paid,b.bought,b.used]}));
  var t=rows.map(function(r){return r.map(c).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+t],{type:"text/csv"}));a.download="slotz-buyers.csv";document.body.appendChild(a);a.click();a.remove()
}
$("go").onclick=load;$("key").onkeydown=function(e){if(e.key==="Enter")load()};
$("q").oninput=list;$("csv").onclick=csv;$("ref").onclick=function(){quiet()};
$("out").onclick=function(){data=null;try{sessionStorage.removeItem("slotz-org")}catch(e){}$("key").value="";$("dash").hidden=true;$("login").hidden=false;say("")};
try{if($("key").value)load()}catch(e){}
})();
</script>
</body>
</html>
