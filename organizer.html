<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Slotz organizer dashboard</title>
<style>
:root{--bg:#F6F4FF;--card:#fff;--text:#14122B;--muted:#5d5a78;--brand:#6C3CF0;--cta:#C6F432;--ink:#14122B;--hot:#FF5C6C;--line:#dcd7f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14122B;--card:#1f1c3d;--text:#F6F4FF;--muted:#b4b0d6;--line:#352f66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:18px 18px 50px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.03em;color:var(--brand);margin:0 0 4px}.logo b{color:var(--hot)}
h2{margin:22px 0 8px;font-size:19px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button{font-family:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:14px;cursor:pointer;width:100%;margin-top:12px}
.go{background:var(--cta);color:var(--ink)}
.alt{background:none;color:var(--text);border:2px solid var(--text);font-size:15px;font-weight:700;padding:11px}
.msg{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.msg.bad{background:var(--hot);color:#14122B;border-color:var(--hot)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.k{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.k small{display:block;color:var(--muted);font-size:13px}.k b{display:block;font-size:22px;letter-spacing:-.01em;overflow-wrap:anywhere}
.k.pay{background:var(--cta);color:var(--ink);border-color:var(--cta)}.k.pay small{color:var(--ink);opacity:.75}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 14px}
.by{padding:10px 0;border-bottom:1px solid var(--line)}.by:last-child{border-bottom:0}
.by strong{display:block}.by span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.in{color:#1a8f4c;font-weight:700}
.terms{max-height:46vh;overflow:auto;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
.terms h3{margin:12px 0 2px;font-size:15px}.terms h3:first-child{margin-top:0}.terms p{margin:0 0 6px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px;color:var(--text)}
.chk input{width:24px;height:24px;margin:0;flex:none;accent-color:#6C3CF0}
button:disabled{opacity:.45;cursor:not-allowed}
details{margin-top:18px}summary{cursor:pointer;font-weight:700}
.muted{color:var(--muted);font-size:14px}
[hidden]{display:none!important}
</style>
<script src="config.js"></script>
</head>
<body>
<main>
<p class="logo">Slotz<b>.</b> organizer</p>
<div id="login">
  <label for="key">Dashboard key</label>
  <input id="key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="go" id="go">Open dashboard</button>
</div>
<div class="msg" id="msg" hidden></div>
<div id="agree" hidden>
  <h2 id="agt" style="margin-top:14px">Organizer agreement</h2>
  <p class="muted" style="margin:0 0 10px">Please read this before you open your dashboard. You only do this once.</p>
  <div class="terms" id="agterms" tabindex="0"></div>
  <label for="sn">Type your full name to sign</label>
  <input id="sn" autocomplete="name">
  <label class="chk" for="ck"><input type="checkbox" id="ck"><span>I have read and agree to this Organizer Agreement. I understand that ticking this box and typing my name is my electronic signature.</span></label>
  <button class="go" id="ago" disabled>Agree and open dashboard</button>
  <button class="alt" id="adis">Cancel</button>
</div>
<div id="dash" hidden>
  <h2 id="ttl" style="margin-top:14px"></h2>
  <p class="muted" id="upd" style="margin:0"></p>
  <div class="grid" id="kp"></div>
  <h2>Payout summary</h2>
  <div class="card" id="pay"></div>
  <p class="muted">Ticket sales are what buyers paid for tickets, before the Slotz service fee. Paid out is what Slotz has already sent you.</p>
  <h2>By ticket type</h2>
  <div class="card" id="ty"></div>
  <h2 id="bh">Buyers</h2>
  <input id="q" placeholder="Search name, phone or ticket number" aria-label="Search buyers">
  <div class="card" id="bl" style="margin-top:10px"></div>
  <button class="alt" id="csv">Download buyer list (CSV)</button>
  <button class="alt" id="ref">Refresh</button>
  <details><summary>Organizer agreement</summary><div class="terms" id="agview" style="margin-top:8px"></div><p class="muted" id="agby"></p></details>
  <button class="alt" id="out">Sign out</button>
</div>
</main>
<script>
(function(){
var VERSION="v1";
var TERMS=[
["1. Your event","You confirm that the event details you give Slotz (name, date, time, venue, ticket types and prices) are true, and that you have the right to hold the event and to sell tickets to it. You confirm that you own, or have permission to use, the flyer and any images you give us."],
["2. Tickets and fees","Slotz sells tickets to your event online and takes payment through Paystack. Buyers pay the ticket price plus a Slotz service fee per ticket. The service fee belongs to Slotz and is shown to buyers before they pay."],
["3. Payouts","Your payout is the ticket sales amount shown on your dashboard, less any amount you and Slotz have agreed in writing. Slotz pays it to the account you gave us, at the time agreed with Slotz. Slotz updates Paid out and Balance on your dashboard after each payout. You must give correct payout details, and Slotz is not responsible for a payout sent to details you gave wrongly."],
["4. Cancellations and refunds","If your event is cancelled, postponed or changed in a way that matters to buyers, you must tell Slotz straight away. Slotz may pause ticket sales. You are responsible for refunds to buyers, and Slotz will work with you to make them."],
["5. Entry at the gate","Each ticket admits the number of people shown on it, one time. Slotz gives you a gate key to check tickets with the Slotz scanner. Keep it private and share it only with staff you trust at your event."],
["6. Buyer information","Your dashboard shows buyers\u2019 names, phone numbers and emails. You may use them only to run this event and to contact buyers about it. You must not sell, share or publish them, or use them for unrelated marketing. You must keep them safe and follow the Nigeria Data Protection Act 2023. Delete them once you no longer need them."],
["7. Your dashboard key","Your dashboard key is private. Do not share it. You are responsible for what is done with it. Tell Slotz at once if you think someone else has it."],
["8. Conduct","Your event must be lawful and must not mislead buyers. Slotz may suspend your event, pause sales, or switch off your dashboard if there is fraud, a serious complaint, or a breach of this agreement."],
["9. Signing","Ticking the box and typing your name is your electronic signature. Slotz records the time, your name and the version of this agreement."]
];
function terms(){return TERMS.map(function(t){return"<h3>"+esc(t[0])+"</h3><p>"+esc(t[1])+"</p>"}).join("")}
var API=window.SLOTZ_API||"",ok=/^https:\/\/script\.google\.com\//.test(API),data=null,timer=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function n(v){return"\u20A6"+Number(v||0).toLocaleString("en-NG")}
function say(t,bad){var m=$("msg");m.className="msg"+(bad?" bad":"");m.textContent=t;m.hidden=!t}
try{$("key").value=sessionStorage.getItem("slotz-org")||""}catch(e){}
function kp(label,val,cls){return'<div class="k '+(cls||"")+'"><small>'+label+'</small><b>'+val+'</b></div>'}
function show(d){
  data=d;var s=d.summary;
  $("login").hidden=true;$("agree").hidden=true;$("dash").hidden=false;say("");
  $("agview").innerHTML=terms();$("agby").textContent=d.agreed?"Agreed by "+d.agreed.name+" on "+d.agreed.at+" (version "+VERSION+")":"";
  $("ttl").textContent=d.organizer+(d.scope==="ALL"?" · all events":" · "+d.scope);
  $("upd").textContent="Updated "+new Date().toLocaleTimeString("en-NG",{hour:"numeric",minute:"2-digit"});
  $("kp").innerHTML=kp("Tickets sold",s.tickets)+kp("People expected",s.people)+kp("Checked in",s.inside+" of "+s.people)+kp("Total collected",n(s.collected));
  $("pay").innerHTML=
    '<div class="row"><span>Ticket sales</span><strong>'+n(s.sales)+'</strong></div>'+
    '<div class="row"><span>Slotz service fees</span><strong>'+n(s.fees)+'</strong></div>'+
    '<div class="row"><span>Total paid by buyers</span><strong>'+n(s.collected)+'</strong></div>'+
    '<div class="row"><span>Paid out so far</span><strong>'+n(s.paidOut)+'</strong></div>'+
    '<div class="row"><span><b>Balance to be paid</b></span><strong>'+n(s.balance)+'</strong></div>';
  $("ty").innerHTML=d.byType.length?d.byType.map(function(t){return'<div class="by"><strong>'+esc(t.type)+(d.scope==="ALL"?" · "+esc(t.event):"")+'</strong><span>'+t.tickets+(t.tickets===1?" ticket":" tickets")+" · "+t.people+" people · "+n(t.sales)+'</span></div>'}).join(""):'<p class="muted">No tickets sold yet.</p>';
  $("bh").textContent="Buyers ("+d.total+")";
  list()
}
function list(){
  if(!data)return;
  var q=$("q").value.trim().toLowerCase();
  var a=data.buyers.filter(function(b){return!q||(b.name+" "+b.phone+" "+b.no+" "+b.email).toLowerCase().indexOf(q)>-1});
  $("bl").innerHTML=a.length?a.map(function(b){
    return'<div class="by"><strong>'+esc(b.name)+' <span>· '+esc(b.no)+'</span></strong><span>'+esc(b.type)+" · admits "+b.admits+" · "+n(b.paid)+(data.scope==="ALL"?" · "+esc(b.event):"")+'</span><br><span>'+esc(b.phone)+" · "+esc(b.email)+'</span><br><span>Bought '+esc(b.bought)+(b.used?' · <span class="in">Checked in '+esc(b.used)+'</span>':'')+'</span></div>'}).join(""):'<p class="muted" style="margin:10px 0">'+(data.buyers.length?"No match.":"No buyers yet.")+'</p>';
}
function post(extra){
  var b={action:"org",key:$("key").value.trim()};for(var k in extra)b[k]=extra[k];
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)}).then(function(r){return r.json()})
}
function showAgree(d){
  $("login").hidden=true;$("dash").hidden=true;$("agree").hidden=false;say("");
  $("agt").textContent="Organizer agreement \u00B7 "+d.organizer+(d.scope==="ALL"?"":" \u00B7 "+d.scope);
  $("agterms").innerHTML=terms();$("sn").value="";$("ck").checked=false;$("ago").disabled=true;
  if(d.version!==VERSION){say("This page is out of date. Refresh the page to see the latest agreement.",true);$("ago").hidden=true}else $("ago").hidden=false
}
function ready(){$("ago").disabled=!($("ck").checked&&$("sn").value.trim().length>=3)}
function load(){
  if(!ok){say("The dashboard could not connect. Try again later.",true);return}
  if(!$("key").value.trim()){say("Enter your dashboard key.",true);return}
  $("go").disabled=true;say("Loading\u2026");
  post().then(function(d){
     $("go").disabled=false;
     if(d.result==="denied"){say("Wrong dashboard key. Check it and try again.",true);return}
     if(d.result==="agree"){showAgree(d);return}
     if(d.result==="org"){try{sessionStorage.setItem("slotz-org",$("key").value.trim())}catch(e){}show(d);if(!timer)timer=setInterval(function(){if(!document.hidden&&data)quiet()},60000);return}
     say("Could not load the dashboard. Please try again.",true)
   }).catch(function(){$("go").disabled=false;say("Could not connect. Check your network and try again.",true)})
}
function sign(){
  $("ago").disabled=true;say("Saving\u2026");
  post({agree:true,name:$("sn").value.trim(),version:VERSION}).then(function(d){
     if(d.result==="org"){try{sessionStorage.setItem("slotz-org",$("key").value.trim())}catch(e){}show(d);if(!timer)timer=setInterval(function(){if(!document.hidden&&data)quiet()},60000)}
     else if(d.result==="denied"){say("Wrong dashboard key.",true);$("agree").hidden=true;$("login").hidden=false}
     else{say("Could not save your agreement. Please try again.",true);ready()}
   }).catch(function(){say("Could not connect. Check your network and try again.",true);ready()})
}
function quiet(){
  post().then(function(d){if(d.result==="org")show(d)}).catch(function(){})
}
function csv(){
  if(!data)return;
  function c(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'}
  var rows=[["Ticket no","Name","Phone","Email","Event","Ticket","Admits","Paid","Bought","Checked in"]].concat(data.buyers.map(function(b){return[b.no,b.name,b.phone,b.email,b.event,b.type,b.admits,b.paid,b.bought,b.used]}));
  var t=rows.map(function(r){return r.map(c).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+t],{type:"text/csv"}));a.download="slotz-buyers.csv";document.body.appendChild(a);a.click();a.remove()
}
$("ck").onchange=ready;$("sn").oninput=ready;$("ago").onclick=sign;
$("adis").onclick=function(){$("agree").hidden=true;$("login").hidden=false;say("")};
$("go").onclick=load;$("key").onkeydown=function(e){if(e.key==="Enter")load()};
$("q").oninput=list;$("csv").onclick=csv;$("ref").onclick=function(){quiet()};
$("out").onclick=function(){data=null;try{sessionStorage.removeItem("slotz-org")}catch(e){}$("key").value="";$("dash").hidden=true;$("agree").hidden=true;$("login").hidden=false;say("")};
try{if($("key").value)load()}catch(e){}
})();
</script>
</body>
</html>
