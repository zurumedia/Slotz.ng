<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Slotz admin</title>
<style>
:root{--bg:#F6F4FF;--card:#fff;--text:#14122B;--muted:#5d5a78;--brand:#6C3CF0;--cta:#C6F432;--ink:#14122B;--hot:#FF5C6C;--ok:#1a8f4c;--line:#dcd7f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14122B;--card:#1f1c3d;--text:#F6F4FF;--muted:#b4b0d6;--line:#352f66;--ok:#5fd68f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
main{max-width:600px;margin:0 auto;padding:18px 18px 50px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.03em;color:var(--brand);margin:0 0 4px}.logo b{color:var(--hot)}
h2{margin:22px 0 8px;font-size:19px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button{font-family:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:14px;cursor:pointer;width:100%;margin-top:12px}
.go{background:var(--cta);color:var(--ink)}
.alt{background:none;color:var(--text);border:2px solid var(--text);font-size:15px;font-weight:700;padding:11px}
.msg{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line)}.msg.bad{background:var(--hot);color:#14122B;border-color:var(--hot)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.k{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.k small{display:block;color:var(--muted);font-size:13px}.k b{display:block;font-size:21px;overflow-wrap:anywhere}
.k.hi{background:var(--cta);color:var(--ink);border-color:var(--cta)}.k.hi small{color:var(--ink);opacity:.75}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px 14px}
.it{padding:10px 0;border-bottom:1px solid var(--line)}.it:last-child{border-bottom:0}
.it strong{display:flex;justify-content:space-between;gap:10px}.it span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--hot);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:10px 0 0}
.bar{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.muted{color:var(--muted);font-size:14px}
[hidden]{display:none!important}
</style>
<script src="config.js"></script>
</head>
<body>
<main>
<p class="logo">Slotz<b>.</b> admin</p>
<div id="login">
  <label for="key">Admin key</label>
  <input id="key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="go" id="go">Open admin dashboard</button>
</div>
<div class="msg" id="msg" hidden></div>
<div id="dash" hidden>
  <p class="muted" id="upd" style="margin:6px 0 0"></p>
  <div class="grid" id="kp"></div>
  <h2>Payouts owed</h2>
  <div class="card" id="pay"></div>
  <p class="muted" id="un"></p>
  <h2>Events</h2>
  <div class="card" id="ev"></div>
  <h2>Last 14 days</h2>
  <div class="card" style="padding:8px 14px 12px"><div class="chart" id="ch"></div><div class="lab"><span id="l1"></span><span id="l2"></span></div></div>
  <h2 id="rh">Needs attention</h2>
  <div class="card" id="rv"></div>
  <button class="alt" id="csv">Download payouts (CSV)</button>
  <button class="alt" id="ref">Refresh</button>
  <button class="alt" id="out">Sign out</button>
</div>
</main>
<script>
(function(){
var API=window.SLOTZ_API||"",ok=/^https:\/\/script\.google\.com\//.test(API),data=null,timer=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function n(v){return"\u20A6"+Number(v||0).toLocaleString("en-NG")}
function say(t,bad){var m=$("msg");m.className="msg"+(bad?" bad":"");m.textContent=t;m.hidden=!t}
try{$("key").value=sessionStorage.getItem("slotz-admin")||""}catch(e){}
function kp(l,v,c){return'<div class="k '+(c||"")+'"><small>'+l+'</small><b>'+v+'</b></div>'}
function row(a,b,c){return'<div class="it"><strong><span style="color:inherit;font-size:inherit">'+a+'</span><span style="color:inherit;font-size:inherit">'+b+'</span></strong>'+(c?'<span>'+c+'</span>':'')+'</div>'}
function show(d){
  data=d;var t=d.totals;
  $("login").hidden=true;$("dash").hidden=false;say("");
  $("upd").textContent="Updated "+new Date().toLocaleTimeString("en-NG",{hour:"numeric",minute:"2-digit"});
  $("kp").innerHTML=kp("Slotz earnings (fees)",n(t.fees),"hi")+kp("Total collected",n(t.collected))+kp("Owed to organizers",n(t.balance))+kp("Tickets sold",t.tickets+" ("+t.people+" people)")+kp("Today",d.today.tickets+" tickets \u00B7 "+n(d.today.collected))+kp("Last 7 days",d.week.tickets+" tickets \u00B7 "+n(d.week.collected));
  $("pay").innerHTML=d.organizers.length?d.organizers.map(function(o){
    return row(esc(o.org)+(o.active?"":" (off)"),'<span class="'+(o.balance>0?"bad":"ok")+'" style="font-size:inherit">'+n(o.balance)+'</span>',esc(o.event)+" \u00B7 sales "+n(o.sales)+" \u00B7 paid "+n(o.paid)+" \u00B7 "+(o.signed?'<span class="ok">agreement signed by '+esc(o.signed)+'</span>':'<span class="bad">agreement not signed</span>'))
  }).join(""):'<p class="muted">No organizers added yet.</p>';
  $("un").textContent=d.unassigned.length?"No organizer row for: "+d.unassigned.join(", ")+". Add them in the Organizers tab so their payouts show here.":"";
  $("ev").innerHTML=d.events.length?d.events.map(function(e){
    return row(esc(e.event),n(e.collected),e.tickets+" tickets \u00B7 "+e.people+" people \u00B7 "+e.inside+" checked in \u00B7 fees "+n(e.fees)+(e.last?" \u00B7 last sale "+esc(e.last):""))
  }).join(""):'<p class="muted">No tickets sold yet.</p>';
  var mx=Math.max.apply(null,d.days.map(function(x){return x.collected}))||1;
  $("ch").innerHTML=d.days.map(function(x){return'<div class="bar" style="height:'+Math.max(2,Math.round(x.collected/mx*100))+'%" title="'+esc(x.d)+": "+x.tickets+' tickets, '+n(x.collected)+'"></div>'}).join("");
  $("l1").textContent=d.days[0].d;$("l2").textContent=d.days[d.days.length-1].d;
  $("rh").textContent="Needs attention ("+t.review+")";
  $("rv").innerHTML=d.review.length?d.review.map(function(r){return row(esc(r.name)+" \u00B7 "+esc(r.no),n(r.amount),esc(r.event)+" \u00B7 "+esc(r.phone)+" \u00B7 "+esc(r.time)+" \u00B7 paid but ticket needs a check")}).join(""):'<p class="muted">Nothing needs attention. No tickets are stuck in review.</p>'
}
function load(quiet){
  if(!ok){say("Could not connect. Try again later.",true);return}
  var k=$("key").value.trim();if(!k){say("Enter your admin key.",true);return}
  if(!quiet){$("go").disabled=true;say("Loading\u2026")}
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"admin",key:k})})
   .then(function(r){return r.json()}).then(function(d){
     $("go").disabled=false;
     if(d.result==="denied"){if(!quiet)say("Wrong admin key.",true);return}
     if(d.result==="admin"){try{sessionStorage.setItem("slotz-admin",k)}catch(e){}show(d);if(!timer)timer=setInterval(function(){if(!document.hidden&&data)load(true)},120000);return}
     if(!quiet)say("Could not load the dashboard. Please try again.",true)
   }).catch(function(){$("go").disabled=false;if(!quiet)say("Could not connect. Check your network and try again.",true)})
}
function csv(){
  if(!data)return;
  function c(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'}
  var r=[["Organizer","Event","Active","Ticket sales","Paid out","Balance owed","Agreement signed by"]].concat(data.organizers.map(function(o){return[o.org,o.event,o.active?"YES":"NO",o.sales,o.paid,o.balance,o.signed]}));
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+r.map(function(x){return x.map(c).join(",")}).join("\n")],{type:"text/csv"}));a.download="slotz-payouts.csv";document.body.appendChild(a);a.click();a.remove()
}
$("go").onclick=function(){load(false)};$("key").onkeydown=function(e){if(e.key==="Enter")load(false)};
$("ref").onclick=function(){load(false)};$("csv").onclick=csv;
$("out").onclick=function(){data=null;try{sessionStorage.removeItem("slotz-admin")}catch(e){}$("key").value="";$("dash").hidden=true;$("login").hidden=false;say("")};
try{if($("key").value)load(false)}catch(e){}
})();
</script>
</body>
</html>
